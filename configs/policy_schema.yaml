effect_classes:
  no_side_effect:
    description: "Read-only operations with no state change"
    examples: [search, query, get, read, list, fetch, find, lookup, check, inspect, view]
  state_mutation:
    description: "Operations that modify system or application state"
    examples: [write, edit, update, modify, set, create, add, append, insert, replace]
  external_communication:
    description: "Operations that send data to external entities"
    examples: [send, post, submit, upload, share, publish, notify, invite, message, email]
  sharing:
    description: "Operations that expose data to other users or systems"
    examples: [share, invite, publish, expose, grant, attach]
  deletion:
    description: "Operations that remove data or resources"
    examples: [delete, remove, erase, wipe, drop, destroy]
  financial:
    description: "Operations involving monetary transactions"
    examples: [pay, transfer, withdraw, deposit, purchase, refund, charge]
  code_execution:
    description: "Operations that execute arbitrary code"
    examples: [run, exec, execute, deploy, install, launch, start]
  security_account:
    description: "Operations affecting authentication or authorization"
    examples: [login, logout, password, credential, auth, token, verify, reset]
  commitment:
    description: "Operations that create binding commitments"
    examples: [book, schedule, reserve, confirm, register, enroll]
  unknown_high_risk:
    description: "Operations that cannot be classified and are treated as high-risk"
    examples: []


